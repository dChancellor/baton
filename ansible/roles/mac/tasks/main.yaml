---
- block:
    - name: Check if Homebrew is installed
      command: brew --version
      register: brew_check
      ignore_errors: true
      changed_when: false

    - name: Ensure Homebrew is installed
      command: /usr/bin/curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh | /bin/bash
      when: brew_check.rc != 0

    # - name: Install Homebrew Cask
    #   homebrew_tap:
    #     name: homebrew/cask

    - name: Ensure curl is installed
      homebrew:
        name: curl
        state: present

    - name: Ensure git is installed
      homebrew:
        name: git
        state: present

    - name: Check default shell
      command:
        argv:
          - dscl
          - .
          - -read
          - /Users/{{ ansible_user_id }}
          - UserShell
      register: mac_user_shell
      changed_when: false

    - name: Set default shell to bash
      command:
        argv:
          - chsh
          - -s
          - /bin/bash
          - "{{ ansible_user_id }}"
      become: true
      when: "'/bin/bash' not in mac_user_shell.stdout"

    - name: Install applications
      homebrew_cask:
        name: "{{ item }}"
        state: present
        accept_external_apps: true
      loop:
        - obsidian
        - alt-tab
        - figma
        - spotify
        - vlc
        - raycast
        - ghostty
        - visual-studio-code

  when: ansible_os_family == "Darwin"
