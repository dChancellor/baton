---
- name: Ensure Homebrew is installed
  homebrew:
    state: present

- name: Install cowsay
  homebrew:
    name: cowsay
    state: present

- name: Install fortune
  homebrew:
    name: fortune
    state: present

- name: Install chafa
  homebrew:
    name: chafa
    state: present

- name: Install chafa
  homebrew:
    name: catimg
    state: present

- name: Get home directory
  import_tasks: ../roles/common/hooks/get-home-directory.yaml

- name: Ensure the package_dir directory exists
  ansible.builtin.file:
    path: "{{ user_home_directory }}/{{ package_dir }}"
    state: directory

- name: Clone pokemon-colorscripts repository
  git:
    repo: https://gitlab.com/phoneybadger/pokemon-colorscripts.git
    dest: "{{ user_home_directory }}/{{ package_dir }}/pokemon-colorscripts"

- name: Ensure scripts directory exists
  ansible.builtin.file:
    path: "{{ user_home_directory }}/.scripts"
    state: directory
    mode: '0755'

- name: Ensure pokemon-colorscripts is executable
  ansible.builtin.file:
    path: "{{ user_home_directory }}/{{ package_dir }}/pokemon-colorscripts/pokemon-colorscripts.py"
    mode: '0755'

- name: Symlink pokemon-colorscripts into scripts directory
  ansible.builtin.file:
    src: "{{ user_home_directory }}/{{ package_dir }}/pokemon-colorscripts/pokemon-colorscripts.py"
    dest: "{{ user_home_directory }}/.scripts/pokemon-colorscripts"
    state: link
    force: true
